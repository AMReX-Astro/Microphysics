id: no-return-in-loop
language: cpp
severity: error
message: return inside a loop fails import (LOWERING/059). Set a result code, break, and return after the loop. At main 970d39ac1e (2026-10-27 probes), it imports and compiles (f03). Keep the rewrite, since tools from 1468c06034 on miscompile burn kernels (hrx-system#2337).
rule:
  kind: return_statement
  inside:
    any: [ { kind: for_statement }, { kind: while_statement }, { kind: do_statement } ]
    stopBy: { kind: function_definition }
  not: { matches: host-branch }
