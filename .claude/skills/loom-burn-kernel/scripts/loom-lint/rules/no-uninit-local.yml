id: no-uninit-local
language: cpp
severity: warning
message: Uninitialized pointer local. No probe covers it; initialize it (`T* p = nullptr;`). Uninitialized scalar, array and struct locals import (d04, d13, d15, d14), as does a scalar passed uninitialized as a T& out-argument (r25).
rule:
  kind: declaration
  inside: { kind: compound_statement }
  has: { field: declarator, kind: pointer_declarator }   # an initialized pointer is an init_declarator
  not: { matches: host-branch }
