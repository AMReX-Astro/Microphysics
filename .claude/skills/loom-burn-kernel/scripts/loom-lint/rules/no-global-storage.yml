id: no-global-storage
language: cpp
severity: error
message: Namespace-scope variables other than constexpr scalars and constexpr arrays are rejected even when unreachable (LOWERING/059). Pass runtime data as kernel arguments; make constant tables constexpr.
rule:
  kind: declaration
  matches: namespace-scope
  not:
    any:
      - matches: host-branch
      - has: { kind: type_qualifier, regex: '^constexpr$' }
