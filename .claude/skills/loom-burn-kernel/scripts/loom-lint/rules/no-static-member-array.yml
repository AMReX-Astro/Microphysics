id: no-static-member-array
language: cpp
severity: error
message: static arrays (static constexpr members, block-scope statics) do not import. Move the table to namespace scope as a constexpr array.
rule:
  any:
    - kind: field_declaration
    - all:
        - kind: declaration
        - inside: { kind: function_definition, stopBy: end }
  has: { kind: storage_class_specifier, regex: '^static$' }
  all:
    - has: { kind: array_declarator, stopBy: end }
  not: { matches: host-branch }
