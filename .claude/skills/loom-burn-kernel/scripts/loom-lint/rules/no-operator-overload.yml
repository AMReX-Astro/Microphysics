id: no-operator-overload
language: cpp
severity: error
message: Member operators other than operator() do not import (probe o09). Free operator overloads on aggregates import (o03), and so do operator() accessors returning T& / const T& (o02, o11, o12).
rule:
  kind: operator_name
  inside: { kind: field_declaration_list, stopBy: end }
  not:
    any:
      - regex: '^operator\s*\(\s*\)$'
      - matches: host-branch
