on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '[0-9][0-9].[0-9][0-9]'

name: Create Release

permissions:
  contents: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set release text
        run: |
          python3 .github/workflows/get_release_txt.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Release $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
