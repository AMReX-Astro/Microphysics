name: "compiler warnings"

on: [pull_request]
jobs:
  compiler_warnings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get AMReX
        run: |
          git clone --branch development --depth 1 https://github.com/AMReX-Codes/amrex.git external/amrex
          echo "AMREX_HOME=${GITHUB_WORKSPACE}/external/amrex" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get -qq -y install curl g++

      - name: Compile burn_cell w/ debug
        run: |
          cd unit_test/burn_cell
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE DEBUG=TRUE WARN_ALL=TRUE WARN_ERROR=TRUE NETWORK_DIR=he-burn/he-burn-19am -j 4

      - name: Compile burn_cell w/o debug
        run: |
          cd unit_test/burn_cell
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE WARN_ALL=TRUE WARN_ERROR=TRUE NETWORK_DIR=he-burn/he-burn-19am -j 4

      - name: Compile burn_cell_sdc w/ debug
        run: |
          cd unit_test/burn_cell_sdc
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE DEBUG=TRUE WARN_ALL=TRUE WARN_ERROR=TRUE NETWORK_DIR=he-burn/he-burn-19am USE_NSE_NET=TRUE SCREEN_METHOD=chabrier1998 -j 4

      - name: Compile burn_cell_sdc w/o debug
        run: |
          cd unit_test/burn_cell_sdc
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE WARN_ALL=TRUE WARN_ERROR=TRUE NETWORK_DIR=he-burn/he-burn-19am USE_NSE_NET=TRUE SCREEN_METHOD=chabrier1998 -j 4

      - name: Compile test_eos w/ debug
        run: |
          cd unit_test/test_eos
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE DEBUG=TRUE WARN_ALL=TRUE WARN_ERROR=TRUE EOS_DIR=gamma_law -j 4

      - name: Compile test_eos w/o debug
        run: |
          cd unit_test/test_eos
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE WARN_ALL=TRUE WARN_ERROR=TRUE EOS_DIR=gamma_law -j 4

      - name: Compile test_sdc w/ debug
        run: |
          cd unit_test/test_sdc
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE DEBUG=TRUE WARN_ALL=TRUE WARN_ERROR=TRUE NETWORK_DIR=aprox19 USE_NSE_TABLE=TRUE -j 4

      - name: Compile test_sdc w/o debug
        run: |
          cd unit_test/test_sdc
          make realclean
          make USE_MPI=FALSE USE_OMP=FALSE WARN_ALL=TRUE WARN_ERROR=TRUE NETWORK_DIR=aprox19 USE_NSE_TABLE=TRUE -j 4
