name: burn_cell_primordial_chem

on: [pull_request]

jobs:
  burn_cell_primordial_chem:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get AMReX
        run: |
          mkdir external
          cd external
          git clone https://github.com/AMReX-Codes/amrex.git
          cd amrex
          git checkout development
          echo 'AMREX_HOME=$(GITHUB_WORKSPACE)/external/amrex' >> $GITHUB_ENV
          echo $AMREX_HOME
          if [[ -n "${AMREX_HOME}" ]]; then exit 1; fi
          cd ../..

      - name: Install dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get -qq -y install curl cmake jq clang g++>=9.3.0

      - name: Compile and run
        run: |
          cd unit_test/burn_cell_primordial_chem
          make -j 4
          ./main1d.gnu.DEBUG.ex inputs_primordial_chem amrex.fpe_trap_{invalid,zero,overflow}=1 > test.out

      - name: Print backtrace
        if: ${{ failure() && hashFiles('unit_test/burn_cell_primordial_chem/Backtrace.0') != '' }}
        run: cat unit_test/burn_cell_primordial_chem/Backtrace.0

      - name: Compare to stored output
        run: |
          cd unit_test/burn_cell_primordial_chem
          python3 - <<'PYTHON'
          import math
          from pathlib import Path

          def diagnostics(filename):
              lines = Path(filename).read_text().splitlines()
              assert "successful? 1" in lines, f"{filename}: burn failed"
              result = {}
              for label in ("T final", "Eint final", "rho final"):
                  line = next(line for line in lines if line.startswith(label + " ="))
                  result[label] = float(line.split("=", 1)[1])
              start = lines.index("New number densities: ") + 1
              species = ("E", "Hp", "H", "Hm", "Dp", "D", "H2p", "Dm",
                         "H2", "HDp", "HD", "HEpp", "HEp", "HE")
              # Helium ions start at the floor and remain negligible; their
              # relative abundance is not a meaningful accuracy check.
              for name, line in zip(species, lines[start:start + len(species)]):
                  if name not in ("HEpp", "HEp"):
                      result[name] = float(line)
              return result

          reference = diagnostics("reference_solution.out")
          actual = diagnostics("test.out")
          for name, expected in reference.items():
              value = actual[name]
              assert math.isfinite(value), f"{name}: nonfinite result"
              error = abs(value - expected) / abs(expected)
              assert error <= 0.01, f"{name}: relative error {error} exceeds 1%"
          PYTHON
