name: Castro

on: [push, pull_request]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-apps
  cancel-in-progress: true

jobs:
  castro:
    name: Castro
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Get Latest Release Tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        AMREX_TAG=$(gh api repos/AMReX-Codes/amrex/releases/latest --jq '.tag_name')
        echo "AMREX_TAG=$AMREX_TAG" >> "$GITHUB_ENV"
    - name: Download Castro
      uses: actions/checkout@v7
      with:
        repository: 'AMReX-Astro/Castro'
        ref: development
        path: 'Castro'
    - name: Download AMReX
      uses: actions/checkout@v7
      with:
        repository: 'AMReX-Codes/amrex'
        ref: ${{env.AMREX_TAG}}
        path: 'amrex'
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies.sh
        .github/workflows/dependencies/dependencies_ccache.sh
    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build flame_wave
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=75M
        export CCACHE_LOGFILE=${{ github.workspace }}/ccache.log.txt
        ccache -z

        export AMREX_HOME=${PWD}/amrex
        export MICROPHYSICS_HOME=${PWD}

        cd Castro/Exec/science/flame_wave/
        make -j 4 CXXSTD=c++20 CCACHE=ccache USE_MPI=FALSE

        ccache -s
        du -hs ~/.cache/ccache

    - name: Build subchandra
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=75M
        export CCACHE_LOGFILE=${{ github.workspace }}/ccache.log.txt
        ccache -z

        export AMREX_HOME=${PWD}/amrex
        export MICROPHYSICS_HOME=${PWD}

        cd Castro/Exec/science/subchandra/
        make -j 4 CXXSTD=c++20 CCACHE=ccache USE_MPI=FALSE NETWORK_DIR=he-burn/he-burn-19am

        ccache -s
        du -hs ~/.cache/ccache
